[package]
name = "ts6-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Diagnostic CLI for the ts6 client core (connect, state, chat, raw commands, TS6 streams)"

[dependencies]
ts6-core = { path = "../ts6-core" }
ts6-audio = { path = "../ts6-audio" }
ts6-input = { path = "../ts6-input" }
anyhow = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1"
